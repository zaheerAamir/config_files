# Reload config
unbind r
bind r source-file ~/.tmux.conf

# Change prefix from Ctrl+b to Ctrl+s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Vim-style copy mode
setw -g mode-keys vi

# Vim pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Clean single-line layout on top
set -g status-position top
set -g status on

# Prevent tmux-power from bleeding into the right side 
set -g @tmux_power_show_host 'false'      
set -g @tmux_power_show_user 'false'      

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'everforest'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Manual color tweaks (Must be below TPM initialization to work)
set -g status-bg '#2b3339'
set -g status-fg '#d3c6aa'

